<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Add user applications to PATH</title>
  <desc id="desc">Static fallback generated from pipx-rhel-05-configure-path.txt</desc>
  <defs>
    <linearGradient id="terminal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17151a"/>
      <stop offset="1" stop-color="#252129"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="#0d0c10"/>
  <rect x="24" y="24" width="1552" height="852" rx="22" fill="url(#terminal)" stroke="#49434c" stroke-width="2"/>
  <circle cx="66" cy="66" r="9" fill="#ff5f57"/>
  <circle cx="96" cy="66" r="9" fill="#febc2e"/>
  <circle cx="126" cy="66" r="9" fill="#28c840"/>
  <text x="800" y="72" fill="#bdb6c0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22">Add user applications to PATH</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20">
    <text x="68" y="134" fill="#ff8d80">[rajat@demo ~]$ echo 'export PATH=&quot;$HOME/.local/bin:$PATH&quot;' &gt;&gt; ~/.bashrc</text>
    <text x="68" y="161" fill="#e8e4ea"> </text>
    <text x="68" y="188" fill="#ff8d80">[rajat@demo ~]$ source ~/.bashrc</text>
    <text x="68" y="215" fill="#e8e4ea"> </text>
    <text x="68" y="242" fill="#ff8d80">[rajat@demo ~]$ command -v pipx</text>
    <text x="68" y="269" fill="#e8e4ea">/home/rajat/.local/bin/pipx</text>
    <text x="68" y="296" fill="#e8e4ea"> </text>
    <text x="68" y="323" fill="#ff8d80">[rajat@demo ~]$ pipx --version</text>
    <text x="68" y="350" fill="#e8e4ea">1.17.2</text>
    <text x="68" y="377" fill="#e8e4ea"> </text>
    <text x="68" y="404" fill="#ff8d80">[rajat@demo ~]$</text>
  </g>
</svg>
