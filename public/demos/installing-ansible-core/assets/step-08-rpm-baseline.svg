<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Record the installed RPM baseline</title>
  <desc id="desc">Static fallback generated from 08-rpm-baseline.txt</desc>
  <defs>
    <linearGradient id="terminal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17151a"/>
      <stop offset="1" stop-color="#252129"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="#0d0c10"/>
  <rect x="24" y="24" width="1552" height="852" rx="22" fill="url(#terminal)" stroke="#49434c" stroke-width="2"/>
  <circle cx="66" cy="66" r="9" fill="#ff5f57"/>
  <circle cx="96" cy="66" r="9" fill="#febc2e"/>
  <circle cx="126" cy="66" r="9" fill="#28c840"/>
  <text x="800" y="72" fill="#bdb6c0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22">Record the installed RPM baseline</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20">
    <text x="68" y="134" fill="#ff8d80">[rajat@demo ~]$ rpm -q ansible-core | tee ~/ansible-core-rpm-baseline.txt</text>
    <text x="68" y="161" fill="#e8e4ea">ansible-core-2.14.18-3.el9_8.1.aarch64</text>
    <text x="68" y="188" fill="#e8e4ea"> </text>
    <text x="68" y="215" fill="#ff8d80">[rajat@demo ~]$ sudo dnf info --installed ansible-core | tee -a ~/ansible-core-rpm-baseline.txt</text>
    <text x="68" y="242" fill="#e8e4ea">Updating Subscription Management repositories.</text>
    <text x="68" y="269" fill="#e8e4ea">Installed Packages</text>
    <text x="68" y="296" fill="#e8e4ea">Name         : ansible-core</text>
    <text x="68" y="323" fill="#e8e4ea">Epoch        : 1</text>
    <text x="68" y="350" fill="#e8e4ea">Version      : 2.14.18</text>
    <text x="68" y="377" fill="#e8e4ea">Release      : 3.el9_8.1</text>
    <text x="68" y="404" fill="#e8e4ea">Architecture : aarch64</text>
    <text x="68" y="431" fill="#e8e4ea">Size         : 10 M</text>
    <text x="68" y="458" fill="#e8e4ea">Source       : ansible-core-2.14.18-3.el9_8.1.src.rpm</text>
    <text x="68" y="485" fill="#e8e4ea">Repository   : @System</text>
    <text x="68" y="512" fill="#e8e4ea">From repo    : rhel-9-for-aarch64-appstream-rpms</text>
    <text x="68" y="539" fill="#e8e4ea">Summary      : SSH-based configuration management, deployment, and task execution system</text>
    <text x="68" y="566" fill="#e8e4ea">URL          : http://ansible.com</text>
    <text x="68" y="593" fill="#e8e4ea">License      : GPLv3+</text>
    <text x="68" y="620" fill="#e8e4ea">Description  : Ansible is a radically simple model-driven configuration management,</text>
    <text x="68" y="647" fill="#e8e4ea">             : multi-node deployment, and remote task execution system. Ansible works</text>
    <text x="68" y="674" fill="#e8e4ea">             : over SSH and does not require any software or daemons to be installed</text>
    <text x="68" y="701" fill="#e8e4ea">             : on remote nodes. Extension modules can be written in any language and</text>
    <text x="68" y="728" fill="#e8e4ea">             : are transferred to managed machines automatically.</text>
    <text x="68" y="755" fill="#e8e4ea"> </text>
    <text x="68" y="782" fill="#ff8d80">[rajat@demo ~]$</text>
  </g>
</svg>
