<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Record and pin the pipx baseline</title>
  <desc id="desc">Static fallback generated from pipx-rhel-step-11-record-baseline.txt</desc>
  <defs>
    <linearGradient id="terminal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17151a"/>
      <stop offset="1" stop-color="#252129"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="#0d0c10"/>
  <rect x="24" y="24" width="1552" height="852" rx="22" fill="url(#terminal)" stroke="#49434c" stroke-width="2"/>
  <circle cx="66" cy="66" r="9" fill="#ff5f57"/>
  <circle cx="96" cy="66" r="9" fill="#febc2e"/>
  <circle cx="126" cy="66" r="9" fill="#28c840"/>
  <text x="800" y="72" fill="#bdb6c0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22">Record and pin the pipx baseline</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20">
    <text x="68" y="134" fill="#ff8d80">[rajat@demo ~]$ pipx --version | tee &quot;$HOME/ansible-core-pipx-baseline.txt&quot;</text>
    <text x="68" y="161" fill="#e8e4ea">1.17.2</text>
    <text x="68" y="215" fill="#ff8d80">[rajat@demo ~]$ pipx list --include-injected | tee -a &quot;$HOME/ansible-core-pipx-baseline.txt&quot;</text>
    <text x="68" y="242" fill="#e8e4ea">package ansible-core 2.21.4, installed using Python 3.12.14</text>
    <text x="68" y="269" fill="#e8e4ea">…</text>
    <text x="68" y="323" fill="#ff8d80">[rajat@demo ~]$ pipx runpip ansible-core freeze --all | tee &quot;$HOME/ansible-core-pipx-requirements.txt&quot;</text>
    <text x="68" y="350" fill="#e8e4ea">ansible-core==2.21.4</text>
    <text x="68" y="377" fill="#e8e4ea">…</text>
    <text x="68" y="431" fill="#ff8d80">[rajat@demo ~]$ pipx pin ansible-core --output json | tee -a &quot;$HOME/ansible-core-pipx-baseline.txt&quot;</text>
    <text x="68" y="458" fill="#e8e4ea">{</text>
    <text x="68" y="485" fill="#e8e4ea">  &quot;data&quot;: { &quot;packages&quot;: [ { &quot;environment&quot;: &quot;ansible-core&quot;,</text>
    <text x="68" y="512" fill="#e8e4ea">    &quot;status&quot;: &quot;pinned&quot;, &quot;version&quot;: &quot;2.21.4&quot; } ] },</text>
    <text x="68" y="539" fill="#e8e4ea">  &quot;errors&quot;: [],</text>
    <text x="68" y="566" fill="#e8e4ea">  &quot;exit_code&quot;: 0,</text>
    <text x="68" y="593" fill="#e8e4ea">  &quot;status&quot;: &quot;success&quot;</text>
    <text x="68" y="620" fill="#e8e4ea">}</text>
    <text x="68" y="674" fill="#ff8d80">[rajat@demo ~]$</text>
  </g>
</svg>
