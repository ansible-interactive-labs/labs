<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">Install Red Hat-provided ansible-core on RHEL 9</title>
  <desc id="description">A signed ansible-core RPM flows from RHEL AppStream through DNF into a validated RHEL 9 control node.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#19090d"/><stop offset=".55" stop-color="#4a111b"/><stop offset="1" stop-color="#101a27"/></linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff726a"/><stop offset="1" stop-color="#c51f30"/></linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse"><path d="M56 0H0V56" fill="none" stroke="#fff" stroke-opacity=".04"/></pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="25"/></filter>
  </defs>
  <rect width="1600" height="900" rx="48" fill="url(#bg)"/><rect width="1600" height="900" rx="48" fill="url(#grid)"/>
  <circle cx="810" cy="465" r="330" fill="#ff4c47" fill-opacity=".14" filter="url(#glow)"/>
  <text x="90" y="100" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="750">ANSIBLE-HOD-001-D01</text>
  <text x="90" y="144" fill="#dcb3ba" font-family="Inter,Arial,sans-serif" font-size="19" letter-spacing="2">RED HAT-PROVIDED INSTALLATION</text>
  <g font-family="Inter,Arial,sans-serif">
    <text x="90" y="238" fill="#fff" font-size="54" font-weight="780">AppStream to a working control node</text>
    <text x="92" y="283" fill="#d8bdc2" font-size="23">Signed RPM · DNF ownership · local validation</text>
  </g>
  <g transform="translate(150 350)" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
    <ellipse cx="210" cy="48" rx="166" ry="42" fill="#2b1118" stroke="#ff8079" stroke-width="3"/>
    <path d="M44 48v166c0 24 74 43 166 43s166-19 166-43V48" fill="#21121a" stroke="#ff8079" stroke-width="3"/>
    <ellipse cx="210" cy="214" rx="166" ry="43" fill="#35131b" stroke="#ff8079" stroke-width="3"/>
    <text x="210" y="124" text-anchor="middle" fill="#fff" font-size="29" font-weight="700">RHEL 9</text>
    <text x="210" y="166" text-anchor="middle" fill="#ff9d97" font-size="21">APPSTREAM</text>
  </g>
  <g fill="none" stroke="#ff8b84" stroke-width="5"><path d="M535 475h177"/><path d="m690 457 24 18-24 18"/></g>
  <g transform="translate(705 365)" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
    <path d="m0 64 128-62 128 62-128 62z" fill="#ff6a62"/><path d="M0 64v154l128 67V126z" fill="#9d1627"/><path d="M256 64v154l-128 67V126z" fill="#d92e39"/>
    <text x="128" y="195" text-anchor="middle" fill="#fff" font-size="35" font-weight="800">RPM</text>
    <rect x="31" y="304" width="194" height="54" rx="14" fill="#0e1118" stroke="#ff776f" stroke-width="2"/>
    <text x="128" y="340" text-anchor="middle" fill="#ff9d97" font-size="20">dnf install</text>
  </g>
  <g fill="none" stroke="#7ce0ce" stroke-width="5"><path d="M1000 475h151"/><path d="m1129 457 24 18-24 18"/></g>
  <g transform="translate(1150 350)" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
    <rect width="330" height="278" rx="30" fill="#08171b" stroke="#62d9c3" stroke-width="3"/>
    <rect x="24" y="24" width="282" height="48" rx="13" fill="#12382f"/>
    <circle cx="52" cy="48" r="7" fill="#79e3d0"/><circle cx="77" cy="48" r="7" fill="#79e3d0" fill-opacity=".55"/>
    <text x="165" y="132" text-anchor="middle" fill="#fff" font-size="28" font-weight="750">ansible-core</text>
    <text x="165" y="177" text-anchor="middle" fill="#79e3d0" font-size="19">RHEL CONTROL NODE</text>
    <text x="42" y="230" fill="#79e3d0" font-size="18">SUCCESS</text><text x="150" y="230" fill="#fff" font-size="18">pong</text>
  </g>
  <g font-family="Inter,Arial,sans-serif" font-size="18" font-weight="750" text-anchor="middle">
    <text x="600" y="823" fill="#dcb3ba">REGISTER</text><circle cx="700" cy="817" r="4" fill="#ff6a62"/>
    <text x="810" y="823" fill="#dcb3ba">INSTALL</text><circle cx="906" cy="817" r="4" fill="#ff6a62"/>
    <text x="1020" y="823" fill="#dcb3ba">VALIDATE</text>
  </g>
</svg>
