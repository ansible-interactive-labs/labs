<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">Install upstream ansible-core with pipx on RHEL 9</title>
  <desc id="description">pipx manages ansible-core in an isolated application environment while exposing its launchers on the rajat user's path.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061b1d"/><stop offset=".54" stop-color="#0a3a3a"/><stop offset="1" stop-color="#24173d"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#57e1c5"/><stop offset="1" stop-color="#bb83ff"/></linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse"><path d="M56 0H0V56" fill="none" stroke="#fff" stroke-opacity=".035"/></pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="28"/></filter>
  </defs>
  <rect width="1600" height="900" rx="48" fill="url(#bg)"/><rect width="1600" height="900" rx="48" fill="url(#grid)"/>
  <circle cx="810" cy="490" r="345" fill="#5de0c7" fill-opacity=".13" filter="url(#glow)"/>
  <text x="90" y="100" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="750">ANSIBLE-HOD-001-D03</text>
  <text x="90" y="144" fill="#acd5d1" font-family="Inter,Arial,sans-serif" font-size="19" letter-spacing="2">UPSTREAM · ISOLATED CLI APPLICATION</text>
  <text x="90" y="238" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="54" font-weight="780">Isolation without manual activation</text>
  <text x="92" y="283" fill="#acd5d1" font-family="Inter,Arial,sans-serif" font-size="23">pipx-managed environment · launchers available on PATH</text>
  <g transform="translate(130 382)" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
    <rect width="330" height="238" rx="30" fill="#071d20" stroke="#62dfc8" stroke-width="3"/>
    <rect x="24" y="24" width="282" height="46" rx="12" fill="#123f3a"/>
    <text x="165" y="127" text-anchor="middle" fill="#fff" font-size="32" font-weight="800">pipx</text>
    <text x="165" y="172" text-anchor="middle" fill="#78e7d2" font-size="18">INSTALL APPLICATION</text>
    <text x="165" y="207" text-anchor="middle" fill="#b2dcd6" font-size="17">Python 3.12</text>
  </g>
  <g fill="none" stroke="#69e4cd" stroke-width="5"><path d="M490 500h145"/><path d="m613 482 24 18-24 18"/></g>
  <g transform="translate(625 340)" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
    <rect width="430" height="340" rx="66" fill="#081d25" stroke="url(#accent)" stroke-width="4"/>
    <rect x="34" y="34" width="362" height="57" rx="18" fill="#163d43"/>
    <circle cx="70" cy="62" r="8" fill="#71e4cf"/><circle cx="98" cy="62" r="8" fill="#71e4cf" fill-opacity=".5"/>
    <text x="215" y="159" text-anchor="middle" fill="#86ead8" font-size="18" letter-spacing="2">MANAGED ENVIRONMENT</text>
    <text x="215" y="217" text-anchor="middle" fill="#fff" font-size="35" font-weight="800">ansible-core</text>
    <text x="215" y="262" text-anchor="middle" fill="#c7a4ff" font-size="18">~/.local/share/pipx</text>
    <rect x="79" y="286" width="272" height="54" rx="16" fill="#100f25" stroke="#b887ff" stroke-width="2"/>
    <text x="215" y="321" text-anchor="middle" fill="#d6baff" font-size="17">isolated dependencies</text>
  </g>
  <g fill="none" stroke="#b789ff" stroke-width="5"><path d="M1055 500h109"/><path d="m1142 482 24 18-24 18"/></g>
  <g transform="translate(1165 380)" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
    <rect width="320" height="242" rx="30" fill="#111025" stroke="#b789ff" stroke-width="3"/>
    <text x="160" y="62" text-anchor="middle" fill="#c9a8ff" font-size="17">~/.local/bin</text>
    <g fill="#fff" font-size="19"><text x="44" y="112">ansible</text><text x="44" y="151">ansible-doc</text><text x="44" y="190">ansible-playbook</text></g>
    <path d="M219 104h50M219 143h50M219 182h50" stroke="#66e2ca" stroke-width="4"/>
    <circle cx="277" cy="104" r="7" fill="#66e2ca"/><circle cx="277" cy="143" r="7" fill="#66e2ca"/><circle cx="277" cy="182" r="7" fill="#66e2ca"/>
  </g>
  <g font-family="Inter,Arial,sans-serif" font-size="18" font-weight="750" text-anchor="middle">
    <text x="570" y="823" fill="#acd5d1">INSTALL</text><circle cx="663" cy="817" r="4" fill="#61e0c8"/>
    <text x="785" y="823" fill="#acd5d1">ISOLATE</text><circle cx="889" cy="817" r="4" fill="#8dccda"/>
    <text x="1018" y="823" fill="#acd5d1">EXPOSE</text>
  </g>
</svg>
