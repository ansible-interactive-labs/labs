<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Inspect the RHEL 9 starting environment</title>
  <desc id="desc">Static fallback generated from 01-inspect-rhel.txt</desc>
  <defs>
    <linearGradient id="terminal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17151a"/>
      <stop offset="1" stop-color="#252129"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="#0d0c10"/>
  <rect x="24" y="24" width="1552" height="852" rx="22" fill="url(#terminal)" stroke="#49434c" stroke-width="2"/>
  <circle cx="66" cy="66" r="9" fill="#ff5f57"/>
  <circle cx="96" cy="66" r="9" fill="#febc2e"/>
  <circle cx="126" cy="66" r="9" fill="#28c840"/>
  <text x="800" y="72" fill="#bdb6c0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22">Inspect the RHEL 9 starting environment</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20">
    <text x="68" y="134" fill="#ff8d80">[rajat@demo ~]$ cat /etc/redhat-release</text>
    <text x="68" y="161" fill="#e8e4ea">Red Hat Enterprise Linux release 9.8 (Plow)</text>
    <text x="68" y="188" fill="#e8e4ea"> </text>
    <text x="68" y="215" fill="#ff8d80">[rajat@demo ~]$ uname -m</text>
    <text x="68" y="242" fill="#e8e4ea">aarch64</text>
    <text x="68" y="269" fill="#e8e4ea"> </text>
    <text x="68" y="296" fill="#ff8d80">[rajat@demo ~]$ hostnamectl --static</text>
    <text x="68" y="323" fill="#e8e4ea">demo.ansible.com</text>
    <text x="68" y="350" fill="#e8e4ea"> </text>
    <text x="68" y="377" fill="#ff8d80">[rajat@demo ~]$ rpm -q ansible-dev-tools</text>
    <text x="68" y="404" fill="#e8e4ea">package ansible-dev-tools is not installed</text>
    <text x="68" y="431" fill="#e8e4ea"> </text>
    <text x="68" y="458" fill="#ff8d80">[rajat@demo ~]$ rpm -q podman container-tools</text>
    <text x="68" y="485" fill="#e8e4ea">package podman is not installed</text>
    <text x="68" y="512" fill="#e8e4ea">package container-tools is not installed</text>
    <text x="68" y="539" fill="#e8e4ea"> </text>
    <text x="68" y="566" fill="#ff8d80">[rajat@demo ~]$</text>
  </g>
</svg>
