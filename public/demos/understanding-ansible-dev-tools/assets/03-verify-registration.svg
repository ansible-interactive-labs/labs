<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Verify the Red Hat connection</title>
  <desc id="desc">Static fallback generated from 03-verify-registration.txt</desc>
  <defs>
    <linearGradient id="terminal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17151a"/>
      <stop offset="1" stop-color="#252129"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="#0d0c10"/>
  <rect x="24" y="24" width="1552" height="852" rx="22" fill="url(#terminal)" stroke="#49434c" stroke-width="2"/>
  <circle cx="66" cy="66" r="9" fill="#ff5f57"/>
  <circle cx="96" cy="66" r="9" fill="#febc2e"/>
  <circle cx="126" cy="66" r="9" fill="#28c840"/>
  <text x="800" y="72" fill="#bdb6c0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22">Verify the Red Hat connection</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20">
    <text x="68" y="134" fill="#ff8d80">[rajat@demo ~]$ sudo rhc status</text>
    <text x="68" y="161" fill="#e8e4ea">Connection status for demo.ansible.com:</text>
    <text x="68" y="188" fill="#e8e4ea"> </text>
    <text x="68" y="215" fill="#e8e4ea">● Connected to Red Hat Subscription Management</text>
    <text x="68" y="242" fill="#e8e4ea">● Connected to Red Hat Insights</text>
    <text x="68" y="269" fill="#e8e4ea">● The Remote Host Configuration daemon is inactive</text>
    <text x="68" y="296" fill="#e8e4ea"> </text>
    <text x="68" y="323" fill="#e8e4ea">Manage your connected systems: https://red.ht/connector</text>
    <text x="68" y="350" fill="#e8e4ea"> </text>
    <text x="68" y="377" fill="#ff8d80">[rajat@demo ~]$</text>
  </g>
</svg>
