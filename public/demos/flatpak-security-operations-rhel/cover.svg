<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Flatpak security and advanced operations on RHEL</title>
  <desc id="desc">Trusted Flatpak remotes feed audited policy layers and managed deployments across a RHEL fleet</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#150b17"/>
      <stop offset="0.55" stop-color="#331522"/>
      <stop offset="1" stop-color="#082b31"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6a67"/>
      <stop offset="1" stop-color="#6ee7d2"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#000" flood-opacity=".36"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1450" cy="75" r="300" fill="#ff4e57" opacity=".1"/>
  <circle cx="150" cy="805" r="340" fill="#6ee7d2" opacity=".08"/>
  <path d="M0 705C300 600 500 810 830 710s530-110 770-20v210H0Z" fill="#fff" opacity=".025"/>

  <text x="90" y="105" fill="#77ead7" font-family="Inter,Arial,sans-serif" font-size="29" font-weight="750" letter-spacing="3">RHEL-HOD-002</text>
  <text x="90" y="182" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="61" font-weight="780">Flatpak security</text>
  <text x="92" y="240" fill="#d8bdc6" font-family="Inter,Arial,sans-serif" font-size="28">Audit · govern · recover · operate</text>

  <g transform="translate(88 350)" font-family="Inter,Arial,sans-serif">
    <text x="0" y="0" fill="#fff" font-size="30" font-weight="720">Enterprise operating controls</text>
    <circle cx="13" cy="62" r="7" fill="#ff6a67"/><text x="38" y="70" fill="#eadde1" font-size="23">Provenance and deployment identity</text>
    <circle cx="13" cy="122" r="7" fill="#ff6a67"/><text x="38" y="130" fill="#eadde1" font-size="23">Layered permission and D-Bus audit</text>
    <circle cx="13" cy="182" r="7" fill="#6ee7d2"/><text x="38" y="190" fill="#eadde1" font-size="23">Controlled update and recovery</text>
    <circle cx="13" cy="242" r="7" fill="#6ee7d2"/><text x="38" y="250" fill="#eadde1" font-size="23">Fleet and offline lifecycle</text>
  </g>

  <g transform="translate(855 145)" filter="url(#shadow)" font-family="Inter,Arial,sans-serif">
    <rect x="0" y="0" width="555" height="605" rx="42" fill="#0e1118" stroke="#fff" stroke-opacity=".15"/>
    <g transform="translate(65 50)">
      <rect width="425" height="92" rx="22" fill="#351720" stroke="#ff6a67" stroke-opacity=".7"/>
      <circle cx="50" cy="46" r="22" fill="#ff6a67"/>
      <path d="M41 46h18M50 37v18" stroke="#351720" stroke-width="5" stroke-linecap="round"/>
      <text x="90" y="39" fill="#fff" font-size="24" font-weight="750">Trusted remote</text>
      <text x="90" y="67" fill="#dbb9c0" font-size="17">origin · signing · credentials</text>
    </g>
    <path d="M277 153v38" stroke="url(#accent)" stroke-width="6" stroke-linecap="round"/>
    <g transform="translate(65 192)">
      <rect width="425" height="150" rx="26" fill="#24202a" stroke="#fff" stroke-opacity=".16"/>
      <path d="M55 33 84 46v24c0 23-13 37-29 45-16-8-29-22-29-45V46z" fill="none" stroke="#ff7776" stroke-width="5"/>
      <text x="112" y="50" fill="#fff" font-size="24" font-weight="750">Effective policy</text>
      <text x="112" y="81" fill="#cbc4cd" font-size="17">baseline · overrides · portals</text>
      <path d="M112 105h245" stroke="#6ee7d2" stroke-width="5" stroke-linecap="round" stroke-dasharray="18 12"/>
    </g>
    <path d="M277 353v38" stroke="url(#accent)" stroke-width="6" stroke-linecap="round"/>
    <g transform="translate(65 392)">
      <rect width="425" height="150" rx="26" fill="#102c30" stroke="#6ee7d2" stroke-opacity=".6"/>
      <g transform="translate(28 38)" fill="none" stroke="#77ead7" stroke-width="4">
        <rect x="0" y="0" width="86" height="58" rx="8"/><rect x="132" y="0" width="86" height="58" rx="8"/><rect x="264" y="0" width="86" height="58" rx="8"/>
        <path d="M43 58v18M175 58v18M307 58v18M18 76h314"/>
      </g>
      <text x="212" y="126" text-anchor="middle" fill="#fff" font-size="22" font-weight="750">Managed RHEL fleet</text>
    </g>
  </g>
  <text x="90" y="820" fill="#bda9af" font-family="Inter,Arial,sans-serif" font-size="20">Rajat’s Applied Technology Lab</text>
</svg>
